<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Staff Account • WardSense Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      background-color: #F8FAFC;
      color: #0F172A;
      letter-spacing: -0.011em;
    }
    h1 { letter-spacing: -0.022em; }
    .auth-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.04);
    }
    .input-clean {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      color: #0F172A;
      transition: all 0.15s ease;
    }
    .input-clean:focus {
      background: #FFFFFF;
      border-color: #0D9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.08);
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#F8FAFC] selection:bg-teal-600 selection:text-white">

  <header class="px-8 py-5 flex items-center justify-between max-w-5xl w-full mx-auto">
    <a href="/login" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-teal-600 text-white flex items-center justify-center shadow-xs">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <span class="font-semibold text-slate-900 text-sm">WardSense Health</span>
    </a>
    <a href="/login" class="text-xs font-semibold text-teal-700 hover:text-teal-800">← Back to Sign In</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="max-w-md w-full space-y-5">
      <div class="text-center space-y-1">
        <h1 class="text-xl font-semibold text-slate-900">Create ICU Staff Account</h1>
        <p class="text-[13px] text-slate-500">Register as a Doctor, Nurse, or ICU Ward Desk Coordinator</p>
      </div>

      <div class="auth-card rounded-xl p-6 sm:p-7">
        <div id="reg-error" class="hidden mb-4 p-2.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

        <form id="register-form" class="space-y-3.5">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Full Name (with Title)</label>
            <input type="text" id="full_name" required placeholder="e.g. Dr. Rohan Mehta, MD or Nurse Pooja Sharma, RN"
              class="w-full px-3 py-2 rounded-lg input-clean text-[13px]" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Clinical Role</label>
              <select id="role" class="w-full px-3 py-2 rounded-lg input-clean text-[13px]">
                <option value="doctor">Doctor (Clinical Portal)</option>
                <option value="nurse">Nurse (Nurse Station)</option>
                <option value="admin">ICU Ward Desk</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">License / Staff ID</label>
              <input type="text" id="badge_id" required value="MCI-55810"
                class="w-full px-3 py-2 rounded-lg input-clean text-[13px]" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">ICU Unit / Department</label>
            <select id="department" class="w-full px-3 py-2 rounded-lg input-clean text-[13px]">
              <option value="Cardiac & Medical ICU">Cardiac &amp; Medical ICU</option>
              <option value="Neuro & Stroke ICU">Neuro &amp; Stroke ICU</option>
              <option value="Thoracic & Surgical ICU">Thoracic &amp; Surgical ICU</option>
              <option value="ICU Ward & Bed Management">ICU Ward &amp; Bed Management</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Work Email</label>
            <input type="email" id="email" required placeholder="rohan.mehta@apollomed-icu.org"
              class="w-full px-3 py-2 rounded-lg input-clean text-[13px]" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="Minimum 6 characters"
              class="w-full px-3 py-2 rounded-lg input-clean text-[13px]" />
          </div>

          <button type="submit" id="reg-btn"
            class="w-full py-2.5 px-4 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold text-[13px] shadow-2xs transition mt-1">
            Create Account &amp; Open Portal →
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400">WardSense Clinical Shift Continuity</footer>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('reg-error');
      const btn = document.getElementById('reg-btn');
      errBox.classList.add('hidden');
      btn.textContent = 'Creating Account...';
      const roleVal = document.getElementById('role').value;
      const roleTitle = roleVal === 'admin' ? 'ICU Ward Coordinator' : (roleVal === 'nurse' ? 'Critical Care Nurse' : 'Attending ICU Physician');
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: document.getElementById('full_name').value,
            role: roleVal,
            badge_id: document.getElementById('badge_id').value,
            department: document.getElementById('department').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            title: roleTitle
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');
        window.location.href = data.redirect_url || '/doctor';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
        btn.textContent = 'Create Account & Open Portal →';
      }
    });
  </script>
</body>
</html>
